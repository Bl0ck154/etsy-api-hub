name: Publish to MCP Registry

# Manual only: npm release must already be public and verified.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write # GitHub OIDC for the official Registry, no PAT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check npm package is published
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          npm view "$PACKAGE@$VERSION" version
          PUBLISHED_MCP_NAME=$(npm view "$PACKAGE@$VERSION" mcpName --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))")
          MANIFEST_MCP_NAME=$(node -p "require('./server.json').name")
          test "$PUBLISHED_MCP_NAME" = "$MANIFEST_MCP_NAME" || {
            echo "Published npm mcpName does not match server.json; publish corrected npm version first"
            exit 1
          }
      - name: Install verified official publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          echo '00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579  mcp-publisher.tar.gz' | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate metadata
        run: ./mcp-publisher validate
      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
