name: Tests
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'assets/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: etsy-hub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
